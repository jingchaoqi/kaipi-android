<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9f6">
<title>kaipi · 开辟</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<script defer src="vendor/marked.js"></script>
<script defer src="render.js"></script>
<script defer src="model.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 0-4h-1a1.5 1.5 0 0 1 0-3h4a5 5 0 0 0 5-5c0-3-4-6-9-6Z"/><circle cx="7.5" cy="9" r=".8"/><circle cx="11" cy="6.5" r=".8"/><circle cx="16" cy="8" r=".8"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></symbol>
<symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
<symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 4v5m0 0H6v6m6-6h6v6"/><rect x="9" y="2" width="6" height="4" rx="1.5"/><rect x="3" y="15" width="6" height="5" rx="1.5"/><rect x="15" y="15" width="6" height="5" rx="1.5"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.7 2.4-2.5.5-1.8 3 1.4 2.1-.2 2.3L4 15.2l1.8 3 2.5.5L9 21h6l.7-2.3 2.5-.5 1.8-3-1.2-1.9-.2-2.3L20 8.9l-1.8-3-2.5-.5L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1-4a8.5 8.5 0 1 1 16-4.5Z"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l5-1L21 7a2.8 2.8 0 0 0-4-4L5 15Z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4m-2-2h4"/></symbol>
<symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><path d="M6 7.5v9M18 7.5c0 6-12 1-12 7"/></symbol>
<symbol id="i-graft" viewBox="0 0 24 24"><path d="M5 5v14m0-7h14m-5-5 5 5-5 5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 11 11-4 1-3 4-3-5-5-3 4-3ZM10 14l-7 7"/></symbol>
<symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v12h14V8m-10 4h6"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 10h11a6 6 0 0 1 0 12M3 10l5-5M3 10l5 5"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
<symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m9 13 7-7a3 3 0 0 1 4 4L10 20a5 5 0 0 1-7-7L14 2m-8 14 9-9"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 19V5h6l2 3h10v11Z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 0 7M20 3v6h-6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
</defs></svg>
<div id="app" class="app">
<button id="scrim" class="scrim" aria-label="关闭侧栏" tabindex="-1"></button>
<aside id="sidebar" class="sidebar" aria-label="会话">
  <div class="brand"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M16 27V6m0 13C7 19 6 15 6 10m10 5c9 0 10-4 10-9"/><circle cx="16" cy="5" r="2"/><circle cx="6" cy="8" r="2"/><circle cx="26" cy="4" r="2"/></svg></span><span>kaipi<span class="brand-dot">.</span></span><button id="sidebar-close" class="icon-button mobile-only" aria-label="关闭会话侧栏"><svg><use href="#i-close"/></svg></button></div>
  <button id="new-chat" class="new-chat"><svg><use href="#i-plus"/></svg>开启新对话<span>↗</span></button>
  <div class="sidebar-caption">你的思路，逐渐成形</div>
  <label class="search"><svg><use href="#i-search"/></svg><input id="session-search" placeholder="查找对话" aria-label="查找对话"></label>
  <div class="section-label">对话 <span id="session-count">0</span></div>
  <nav id="sessions" class="sessions" aria-label="对话列表"></nav>
  <div class="sidebar-bottom"><button id="workspace" class="workspace"><span class="workspace-icon"><svg><use href="#i-folder"/></svg></span><span><strong>本地工作区</strong><small>想法与文件，留在这里</small></span><svg><use href="#i-down"/></svg></button><button id="appearance-button" class="settings-row"><svg><use href="#i-palette"/></svg>外观与色彩<span>↗</span></button><button id="settings" class="settings-row"><svg><use href="#i-settings"/></svg>模型与设置<span>↗</span></button></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="top-left"><button id="sidebar-toggle" class="icon-button" aria-label="切换会话侧栏" aria-expanded="false"><svg><use href="#i-menu"/></svg></button><button id="model-picker" class="model-picker">选择模型<svg><use href="#i-down"/></svg></button></div>
    <button id="tree-toggle" class="context-toggle" aria-expanded="false"><svg><use href="#i-tree"/></svg><span>上下文</span><b id="node-count">0</b></button>
  </header>
  <div class="conversation-heading" id="conversation-heading" hidden><button id="rename" title="重命名对话"><span id="chat-title">新的对话</span><svg><use href="#i-edit"/></svg></button><span id="chat-subtitle">从一个问题开始，让思路自由生长。</span></div>
  <div id="connection" class="connection" role="status"><span class="spinner"></span><span>正在唤醒本地引擎…</span></div>
  <div id="scroll" class="conversation-scroll">
    <section id="welcome" class="welcome">
      <div class="welcome-eyebrow"><span class="eyebrow-line"></span> 留出空间，探索更多可能</div>
      <h1>一个想法，<br>可以有很多种<span>可能。</span></h1>
      <p>和 kaipi 一起思考、编写与创造。<br>让探索长成分支，把有价值的发现带回主干。</p>
      <div class="starter-grid">
        <button class="starter" data-prompt="帮我了解这个项目的结构，梳理主要模块和它们之间的关系。"><svg><use href="#i-code"/></svg><strong>读懂一个项目</strong><span>从结构到细节，建立全貌</span><svg class="starter-arrow"><use href="#i-right"/></svg></button>
        <button class="starter" data-prompt="我有一个新想法。先帮我梳理需求，再一起探索几种实现方案。"><svg><use href="#i-spark"/></svg><strong>把想法变成现实</strong><span>一起找到值得实现的方向</span><svg class="starter-arrow"><use href="#i-right"/></svg></button>
      </div>
      <button id="welcome-tree" class="tree-intro"><svg><use href="#i-branch"/></svg><span>思路不必是一条直线</span><span class="intro-detail">认识树形上下文</span><svg><use href="#i-right"/></svg></button>
    </section>
    <section id="messages" class="messages" aria-label="对话内容"></section>
  </div>
  <button id="jump-bottom" class="jump-bottom icon-button" aria-label="回到最新消息" hidden><svg><use href="#i-down"/></svg></button>
  <footer class="composer-area">
    <div id="context-bar" class="context-bar"><button id="cursor-chip" class="cursor-chip"><span class="status-dot"></span><span>新的起点</span><svg><use href="#i-down"/></svg></button><span id="context-size">上下文 0 tokens</span></div>
    <div id="pending" class="pending"></div>
    <form id="composer" class="composer">
      <div id="attachments" class="attachments"></div>
      <textarea id="draft" placeholder="写下你的想法…" rows="1" aria-label="消息" maxlength="200000"></textarea>
      <div class="composer-tools"><div class="composer-left"><button id="attach" type="button" class="icon-button" aria-label="添加附件"><svg><use href="#i-paperclip"/></svg></button><button id="explore-toggle" type="button" class="explore-toggle" aria-pressed="false"><svg><use href="#i-branch"/></svg><span>探索</span></button></div><button id="send" class="send" type="submit" aria-label="发送消息" disabled><svg><use href="#i-arrow"/></svg></button></div>
    </form>
    <div class="composer-note"><span>分支中探索 · 主干上创造</span><span id="spend">kaipi · 本地运行</span></div>
  </footer>
</main>
<aside id="context-panel" class="context-panel" aria-label="树形上下文" inert>
  <header class="panel-header"><div><span class="overline">让思路可见</span><h2>上下文树<span id="tree-total">00</span></h2></div><button id="tree-close" class="icon-button" aria-label="关闭上下文树"><svg><use href="#i-close"/></svg></button></header>
  <div class="tree-toolbar"><span class="tree-legend"><i></i>主干<span class="branch-dot"></span>探索</span><label class="archive-filter"><input id="show-archived" type="checkbox">显示归档</label></div>
  <div id="tree-viewport" class="tree-viewport"><div id="tree-stage" class="tree-stage"></div><div id="tree-empty" class="tree-empty"><svg><use href="#i-branch"/></svg><h3>每个问题，都是一个节点</h3><p>从任意节点开启探索，把发现嫁接回主干。<br>对话开始后，你的思路会在这里生长。</p></div></div>
  <div class="tree-controls"><button id="zoom-out" class="icon-button" aria-label="缩小树"><svg><use href="#i-minus"/></svg></button><span id="zoom-level">100%</span><button id="zoom-in" class="icon-button" aria-label="放大树"><svg><use href="#i-plus"/></svg></button><span class="control-divider"></span><button id="tree-fit" class="icon-button" aria-label="适应视图"><svg><use href="#i-fit"/></svg></button><button id="tree-current" class="text-button">当前位置</button></div>
  <section id="inspector" class="inspector" hidden></section>
  <div class="tree-footnote"><svg><use href="#i-branch"/></svg><span>点选节点，查看内容或调整上下文</span></div>
</aside>
</div>
<div id="overlay" class="overlay" hidden><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="file-input" type="file" multiple hidden>
</body></html>
